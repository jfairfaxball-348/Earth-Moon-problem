name: S021 cancel redundant earlier revisions (NO SCIENCE)
on:
  push:
    branches: [wip/S021-row148-cross-euler]
    paths:
      - '.github/workflows/s021-cancel-duplicates.yml'
permissions:
  actions: write
  contents: read
jobs:
  cancel-earlier-research-revisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Cancel two superseded S021 jobs so only final revision remains active
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for id in 38760056791 38760158280; do
            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPO/actions/runs/$id/cancel" || true
          done
