name: Research scaffold checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate authoritative state and catalogues
        run: python scripts/check_scaffold.py
      - name: Run preliminary certificate checker tests
        run: python -m unittest discover -s tests -v
      - name: Validate S026 archived evidence integrity
        run: python scripts/check_s026_records.py
      - name: Validate S027 archived evidence integrity
        run: python scripts/check_s027_records.py
      - name: Validate S028 archived evidence integrity and D062 prompt
        run: python scripts/check_d062_records.py
      - name: Validate S029 frozen landscape and S030 prompt
        run: python scripts/check_s030_history.py
      - name: Validate S030 bounded search records and S031 prompt
        run: python scripts/check_s030_records.py
      - name: Validate S031 capped long-run records and S032 future prompt
        run: python scripts/check_s031_records.py
      - name: Validate S032 owner-stop archives and progress rebuild records
        run: python scripts/check_d071_active_prompt.py
