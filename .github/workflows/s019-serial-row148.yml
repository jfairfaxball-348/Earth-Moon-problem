name: S019 original row148 continued science (NEVER MERGE WIP)
on:
  push:
    branches: [wip/S019-row148-continuation]
    paths:
      - 'tools/s019_serial_148.py'
      - '.github/workflows/s019-serial-row148.yml'
      - 'campaigns/CAM-0021.md'
permissions:
  contents: write
jobs:
  row148-serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact original, preregistered code and campaign
        run: |
          python -m py_compile tools/s019_serial_148.py
          sha256sum tools/s019_serial_148.py campaigns/CAM-0021.md .github/workflows/s019-serial-row148.yml
      - name: Pinned original native toolchain
        run: bash scripts/cloud_setup.sh
      - name: Full native original 271 and K9 cold smoke in SAME job
        run: .venv/bin/python scripts/cloud_smoke.py
      - name: ONE original row148, restore previous 6-unplaced and 19480 sound cuts
        run: |
          ulimit -v 12582912
          timeout --signal=TERM --kill-after=20s 1500s .venv/bin/python -u tools/s019_serial_148.py
      - name: Persist evidence on NEVER MERGED WIP
        if: always()
        run: |
          mkdir -p validation/S019-WIP
          cp artifacts/tmp/S019/result.json validation/S019-WIP/result.json || true
          cp artifacts/tmp/S019/row148_best_partial.json validation/S019-WIP/row148_best_partial.json || true
          cp artifacts/tmp/S019/row148_lemmas.json.gz validation/S019-WIP/row148_lemmas.json.gz || true
          cp artifacts/tmp/S019/row148.split.json validation/S019-WIP/row148.split.json || true
          cp artifacts/tmp/S019/row148_native.drat.gz validation/S019-WIP/row148_native.drat.gz || true
          cp artifacts/tmp/cloud_smoke/RESULT.json validation/S019-WIP/SMOKE.json || true
          cp artifacts/tmp/native/ENVIRONMENT.json validation/S019-WIP/ENVIRONMENT.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/S019-WIP
          if ! git diff --cached --quiet; then
            git commit -m 'WIP S019 serial row148 resumed science checkpoints (never merge)'
            git push origin HEAD:wip/S019-row148-continuation
          fi
      - name: Upload machine scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S019-original148-evidence
          retention-days: 60
          if-no-files-found: warn
          path: |
            artifacts/tmp/cloud_smoke/RESULT.json
            artifacts/tmp/native/ENVIRONMENT.json
            artifacts/tmp/S019/*.json
            artifacts/tmp/S019/*.gz
            artifacts/tmp/S019/*.edges
